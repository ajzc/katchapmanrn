<!--
  One manual Meta pixel for the HubSpot blog template header. Do not also enable
  HubSpot's Meta/Facebook pixel. Do not add a Google tag or js.hs-scripts.com here.
  Same dataset as measurement/config.mjs. Articles whose address names a treatment
  do not load the pixel. Automatic matching is off in Events Manager. autoConfig is
  false here; the automatic-event control was not available to verify.
-->
<script>
(function () {
  var META_PIXEL_ID = "2738351096678050";
  var treatment = /botox|dysport|filler|injectable|rhinoplasty|sculptra|radiesse|nasolabial|jawline|neurotoxin|facial-balancing|dermal|under-eye|brow-lift|lip-flip|lip-filler|prp|temple-filler|cheek-filler/i;
  if (treatment.test(location.pathname) || treatment.test(location.search) || treatment.test(document.referrer || "")) return;
  var neutral = { "/": 1, "/blog": 1 };
  var path = location.pathname.replace(/\/$/, "") || "/";
  if (!neutral[path] && path.indexOf("/blog/") === 0 && treatment.test(path)) return;
  if (treatment.test(path)) return;
  var started = false;
  function boot() {
    if (started || window.fbq) return;
    started = true;
    var fbq = window.fbq = function () {
      if (fbq.callMethod) fbq.callMethod.apply(fbq, arguments);
      else fbq.queue.push(arguments);
    };
    window._fbq = fbq;
    fbq.push = fbq;
    fbq.loaded = true;
    fbq.version = "2.0";
    fbq.queue = [];
    fbq.disablePushState = true;
    fbq("consent", "revoke");
    fbq("set", "autoConfig", false, META_PIXEL_ID);
    fbq("dataProcessingOptions", ["LDU"], 0, 0);
    fbq("init", META_PIXEL_ID);
    fbq("consent", "grant");
    fbq("track", "PageView");
    var script = document.createElement("script");
    script.async = true;
    script.src = "https://connect.facebook.net/en_US/fbevents.js";
    document.head.appendChild(script);
  }
  var _hsp = window._hsp = window._hsp || [];
  _hsp.push(["addPrivacyConsentListener", function (consent) {
    var analytics = consent && (consent.allowed === true || (consent.categories && consent.categories.analytics));
    if (analytics) boot();
    else if (window.fbq) window.fbq("consent", "revoke");
  }]);
})();
</script>
